[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "refblind"
version = "0.2.0"
description = "Auditable reference-blind MLIP/DFT benchmark and sequential fidelity escalation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "PyYAML>=6,<7"]

[project.scripts]
refblind = "refblind.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=5,<8", "ruff>=0.6,<1"]
analysis = ["matplotlib>=3.8,<4", "scikit-learn>=1.4,<2"]
ase = ["ase>=3.23,<4"]
pyscf = ["pyscf>=2.7,<3"]
uma = ["ase>=3.23,<4", "fairchem-core>=2,<3"]
mace = ["ase>=3.23,<4", "mace-torch>=0.3.14,<1"]
orb = ["ase>=3.23,<4", "orb-models>=0.5,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
refblind = ["py.typed"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = ["integration: optional real external chemistry backend (not part of the portable default suite)"]

[tool.coverage.run]
source = ["refblind"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
